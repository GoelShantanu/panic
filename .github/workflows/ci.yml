name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stockpanic_ci
          # Disposable service only; published exclusively on the runner's loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockpanic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/stockpanic_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify database constraints
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d stockpanic_ci -v ON_ERROR_STOP=1 < docs/database/tests/0001_constraints_test.sql
      - name: Run all tests (no skips)
        run: npm run test:ci
      - name: Build production frontend
        run: npm run web:build

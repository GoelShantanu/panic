<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-labelledby="title desc">
  <title id="title">BazaarPanic — Stock Market News</title>
  <desc id="desc">Geometric Precision Bull and Bear news signal emblem with the BazaarPanic wordmark. Transparent background.</desc>
  <defs>
    <mask id="bp-signal-mask-h" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <path fill="#FFFFFF" d="M0 0H160V160H0Z" />
      <circle cx="132" cy="28" r="18" fill="#000000" />
    </mask>
  </defs>
  <!-- Emblem on left scaled to 120x120 -->
  <g transform="translate(16, 16) scale(0.3)">
    <g mask="url(#bp-signal-mask-h)">
      <rect x="55" y="55" width="290" height="290" rx="52" fill="none" stroke="#14243A" stroke-width="16" />
      <path d="M 62,338 L 308,92" fill="none" stroke="#14243A" stroke-width="12" stroke-linecap="round" />
      <path fill="#14243A" d="M 88,252 L 104,188 L 128,154 L 158,136 L 178,132 L 214,84 L 224,90 L 196,128 L 248,104 L 252,112 L 212,136 L 230,154 L 214,180 L 194,180 L 182,166 L 164,194 L 142,228 L 116,262 Z" />
      <path fill="#245FC2" d="M 312,156 L 312,284 L 276,314 L 234,314 L 216,288 L 194,268 L 184,244 L 168,226 L 188,220 L 200,230 L 210,210 L 234,190 L 248,162 L 262,168 L 258,190 L 290,178 Z" />
    </g>
    <circle cx="330" cy="70" r="28" fill="#245FC2" />
  </g>
  <!-- Wordmark -->
  <text x="160" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#14243A">Bazaar</tspan><tspan fill="#245FC2">Panic</tspan>
  </text>
  <text x="164" y="132" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.28em">
    INDIAN STOCK MARKET NEWS &amp; VOLATILITY
  </text>
</svg>